name: Build Deb (Theos)
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix perms for theos-action cache (arm64 /usr/local 不可写)
        if: runner.os == 'macOS'
        run: sudo mkdir -p /usr/local/opt && sudo chown -R "$(whoami)" /usr/local/opt
      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
      - name: Ensure GNU make on PATH (arm64 homebrew 在 /opt/homebrew)
        if: runner.os == 'macOS'
        run: echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Ensure script exec bits (Windows checkout 丢可执行位)
        run: chmod 0755 layout/DEBIAN/postinst
      - name: Build package (rootless)
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: Tweak-deb
          path: packages/*.deb
          if-no-files-found: error
      # 自动发布到越狱源 yzdmm2024/repo（debs/ + 重算 Packages）。
      # 需在仓库 Settings → Secrets 配置 REPO_DEPLOY_TOKEN（对 yzdmm2024/repo 有写权限的 PAT）。
      # 未配置该 secret 时本步自动跳过，仍可走手动发布流程。
      - name: publish to source repo (yzdmm2024/repo)
        if: ${{ success() && secrets.REPO_DEPLOY_TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.REPO_DEPLOY_TOKEN }}
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -1)
          BASE=$(basename "$DEB")
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/yzdmm2024/repo.git" _src
          cp "$DEB" "_src/debs/$BASE"
          cd _src
          python3 gen_packages.py
          git add -A
          git diff --cached --quiet || { git commit -m "ci: publish $BASE"; git push origin HEAD:main; }

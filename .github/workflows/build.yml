name: Build Deb (Theos)
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix perms for theos-action cache (arm64 /usr/local 不可写)
        if: runner.os == 'macOS'
        run: sudo mkdir -p /usr/local/opt && sudo chown -R "$(whoami)" /usr/local/opt
      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
      - name: Ensure GNU make on PATH (arm64 homebrew 在 /opt/homebrew)
        if: runner.os == 'macOS'
        run: echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build package (rootless)
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: Tweak-deb
          path: packages/*.deb
          if-no-files-found: error
